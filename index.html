   h+='<div class="ad"><input data-i="'+i+'" data-k="0" value="'+esc(it.t[0])+'" placeholder="中文品名">'+sel(it,i)+'<details><summary>翻譯 / Translations</summary>'+[1,2,3,4,5].map(function(k){return '<input data-i="'+i+'" data-k="'+k+'" value="'+esc(it.t[k])+'" placeholder="'+L[LG[k]].n+'">'}).join('')+'</details><div class="p">'+L.zh.sz.map(function(s,j){return '<span class="mu">'+s+'</span><input type="number" inputmode="numeric" min="0" data-i="'+i+'" data-k="p'+j+'" value="'+it.d[j]+'">'}).join('')+'<button class="btn d" data-a="del" data-v="'+i+'" style="margin-left:auto">刪除</button></div></div>'});
  h+='<div style="text-align:center;margin-top:6px"><button class="btn" data-a="add" data-v="'+c+'">＋ 新增品項</button></div></section>'}
 h+='<div class="save"><button class="btn f" data-a="save">儲存</button><span id="msg" class="mu"></span></div>';
 A.innerHTML=h}
function collect(){A.querySelectorAll('[data-i]').forEach(function(e){var it=D.items[+e.dataset.i];if(!it)return;var k=e.dataset.k;if(k=='s')it.s=e.value;else if(k[0]=='p')it.d[+k[1]]=parseInt(e.value,10)||0;else it.t[+k]=e.value.trim()})}
function msg(s){var m=$('msg');if(m)m.textContent=s}
async function save(){collect();msg('儲存中…');try{
 var old=D.items.filter(function(it){return it.id}),nw=D.items.filter(function(it){return !it.id});
 if(del.length)await api('DELETE','?id=in.('+del.join(',')+')');
 if(old.length)await api('POST','',old.map(function(it){var r=toRow(it,D.items.indexOf(it));r.id=it.id;return r}),'resolution=merge-duplicates,return=minimal');
 if(nw.length)await api('POST','',nw.map(function(it){return toRow(it,D.items.indexOf(it))}));
 del=[];await load();admin();msg('✅ 已儲存，客人頁面已更新')}catch(e){msg('失敗：'+(e.message||e))}}
A.onclick=async function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,v=b.dataset.v;
 if(a=='go'){if(view=='admin')collect();view=v;if(v=='admin'&&location.hash!='#admin')try{history.replaceState(null,'','#admin')}catch(x){}render()}
 else if(a=='save')save();
 else if(a=='login'){msg('登入中…');try{putS(await tok('password',{email:$('em').value.trim(),password:$('pw').value}));canEdit=true;await load();admin()}catch(x){msg('登入失敗：'+(x.message||x))}}
 else if(a=='logout'){putS(null);canEdit=false;view='home';render()}
 else if(a=='qr'){var q=$('qr'),u=$('qrurl').value.trim();q.innerHTML='';if(window.QRCode&&u)new QRCode(q,{text:u,width:200,height:200});else q.textContent='請先輸入網址'}
 else if(a=='del'){if(b.dataset.c){collect();var it=D.items[+v];if(it.id)del.push(it.id);D.items.splice(+v,1);admin()}else{b.dataset.c='1';b.textContent='確定刪除？';b.style.background='#c33';b.style.color='#fff';setTimeout(function(){if(b.isConnected){delete b.dataset.c;b.textContent='刪除';b.style.background='';b.style.color=''}},3500)}}
 else if(a=='add'){collect();D.items.push({c:+v,t:['新品項','','','','',''],d:[0,0,0],s:''});admin()}};
function route(){if(location.hash=='#admin')view='admin';else if(view=='admin')view='home';render()}
window.addEventListener('hashchange',route);
(async function(){sess=getS();if(sess){try{await ensure();canEdit=true}catch(e){putS(null)}}
 route();await load();render()})();
</script></body></html>
